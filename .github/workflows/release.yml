name: release

# The standalone didpkg binaries (packages/cli/compile.ts). Each push and each pull request is a dry run: it builds
# the 4 archives and SHA256SUMS, and tests each binary on a native runner. A v* tag also makes the GitHub Release,
# with an attestation of build provenance for each file.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - id: version
        run: echo "version=$(jq -r .version packages/cli/package.json)" >> "$GITHUB_OUTPUT"
      - name: The tag must be v<package version>
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not v$VERSION, the version in packages/cli/package.json"
            exit 1
          fi
      # Bun cross-compiles: this runner builds the 4 targets.
      - run: bun packages/cli/compile.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: packages/cli/dist-bin/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Each binary on its own OS and CPU: the SHA-256, the version and an install name.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: darwin-arm64, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: bin
      - name: Check the SHA-256, then unpack
        working-directory: bin
        run: |
          if command -v sha256sum >/dev/null; then sum='sha256sum'; else sum='shasum -a 256'; fi
          grep "  didpkg-$TARGET.tar.gz\$" SHA256SUMS | $sum -c -
          tar -xzf "didpkg-$TARGET.tar.gz"
      - name: Run the binary
        run: |
          uname -sm
          b="bin/didpkg-$TARGET/didpkg"
          file "$b"
          test "$("$b" --version)" = "$VERSION"
          "$b" name did:web:nonni.org hello

  # The demo (exit criterion 1 of Phase 1) with the Linux x64 binary in place of src/cli.ts.
  demo:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # pnpm 11 needs Node 22.13 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global pnpm@11.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: ${{ runner.temp }}/bin
      - name: Check the SHA-256, then unpack
        working-directory: ${{ runner.temp }}/bin
        run: |
          grep '  didpkg-linux-x64.tar.gz$' SHA256SUMS | sha256sum -c -
          tar -xzf didpkg-linux-x64.tar.gz
      - run: DIDPKG_BIN="$RUNNER_TEMP/bin/didpkg-linux-x64/didpkg" bun demo/e2e.ts

  # Only for a v* tag, after all tests pass. Only this job can write to the repository.
  release:
    if: github.ref_type == 'tag'
    needs: [build, smoke, demo]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release
      id-token: write # the OIDC token for the Sigstore certificate
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: bin
      # A user checks a file with: gh attestation verify <file> -R bnonni/didpkg
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            bin/*.tar.gz
            bin/SHA256SUMS
      - name: Make the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "didpkg $TAG" --generate-notes bin/*.tar.gz bin/SHA256SUMS
