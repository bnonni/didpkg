name: pages

# Builds the landing page (site/) and deploys it to GitHub Pages.
# The deploy job runs only if the repository variable PAGES_DEPLOY is true. Set it after Pages is on, with the source "GitHub Actions".
# The custom domain is a Pages setting. A deploy from a workflow ignores a CNAME file.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - packages/adapter-dwn/src/protocol.ts
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun site/build.ts
      - run: bun site/check.ts
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    if: vars.PAGES_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
